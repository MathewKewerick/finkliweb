  <!-- Blob 2 — bottom right (85% 88%), 50% × 45% of canvas -->
  <ellipse cx="918" cy="950" rx="270" ry="243" fill="url(#blob2)"/>

  <!-- Blob 3 — centre right (70% 30%), 40% × 40% of canvas -->
