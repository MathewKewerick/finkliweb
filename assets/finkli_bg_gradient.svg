<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#03D98C" stop-opacity="0.08"/>
      <stop offset="60%"  stop-color="#03D98C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#03D98C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#03D98C" stop-opacity="0.06"/>
      <stop offset="60%"  stop-color="#03D98C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#03D98C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#03D98C" stop-opacity="0.04"/>
      <stop offset="65%"  stop-color="#03D98C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#03D98C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mint background -->
  <rect width="1080" height="1080" fill="#F4FFF9"/>

  <!-- Blob 1 — top left (18% 12%), 55% × 50% of canvas -->
